<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>심풀 스터디 · 오프라인</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e6edf7;
       font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .box{text-align:center;padding:24px}
  img{width:160px;margin-bottom:20px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#97a6bf;margin:0 0 24px}
  button{border:0;border-radius:12px;padding:12px 22px;font-size:15px;color:#fff;
         background:linear-gradient(120deg,#60a5fa,#8b5cf6)}
</style>
</head>
<body>
  <div class="box">
    <img src="./simpul-logo.png" alt="Simpul">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
